<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f2">
  <title>Mahjong5</title>
</head>
<body>
  <main class="table">
    <header class="top">
      <h1>Mahjong5</h1>
      <button id="open-settings" class="settings-button" type="button" aria-label="設定" aria-haspopup="dialog">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3h4l.5 2.6 1.8 1 2.5-.8 2 3.4-2 1.8v2l2 1.8-2 3.4-2.5-.8-1.8 1L14 21h-4l-.5-2.6-1.8-1-2.5.8-2-3.4 2-1.8v-2l-2-1.8 2-3.4 2.5.8 1.8-1L10 3Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </header>

    <div class="stats">
      <div><span>残りツモ</span><strong id="remaining"></strong></div>
      <div><span>累計和了</span><strong id="wins"></strong></div>
    </div>

    <div class="play-area">
      <section class="tray" aria-labelledby="discard-title">
        <h2 id="discard-title">捨て牌</h2>
        <div id="discards" class="discards"></div>
      </section>

      <section id="player" class="player" aria-labelledby="hand-title">
        <div class="player-head">
          <h2 id="hand-title">手牌</h2>
          <p id="status" role="status"></p>
        </div>
        <div id="hand" class="hand"></div>
        <div id="legend" class="legend" hidden><span>面子</span><span>雀頭</span></div>
        <button id="again" class="again" type="button" hidden>もう一度</button>
      </section>
    </div>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">設定</h2>
    <fieldset class="settings-field" aria-describedby="draw-limit-note">
      <legend>最大ツモ回数</legend>
      <div id="draw-limit" class="settings-options"></div>
      <p id="draw-limit-note">32 回は山がなくなるまで。次の局から反映されます。</p>
    </fieldset>
    <fieldset class="settings-field">
      <legend>牌の種類</legend>
      <div id="tile-suit" class="settings-options"></div>
    </fieldset>
    <fieldset class="settings-field">
      <legend>効果音</legend>
      <div id="sound" class="settings-options"></div>
    </fieldset>
    <form method="dialog">
      <button class="settings-button" type="submit" autofocus>閉じる</button>
    </form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
