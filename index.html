<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f2">
  <title>Mahjong5</title>
</head>
<body>
  <main class="table">
    <header class="top">
      <h1>Mahjong5</h1>
      <button id="open-settings" class="settings-button" type="button" aria-label="設定" aria-haspopup="dialog">⚙</button>
    </header>

    <div class="stats">
      <div><span>残りツモ</span><strong id="remaining"></strong></div>
      <div><span>累計和了</span><strong id="wins"></strong></div>
    </div>

    <div class="play-area">
      <section class="tray" aria-labelledby="discard-title">
        <h2 id="discard-title">捨て牌</h2>
        <div id="discards" class="discards"></div>
      </section>

      <section id="player" class="player" aria-labelledby="hand-title">
        <div class="player-head">
          <h2 id="hand-title">手牌</h2>
          <p id="status" role="status"></p>
        </div>
        <div id="hand" class="hand"></div>
        <div id="legend" class="legend" hidden><span>面子</span><span>雀頭</span></div>
        <button id="again" class="again" type="button" hidden>もう一度</button>
      </section>
    </div>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">設定</h2>
    <div class="settings-draw-limit">
      <label for="draw-limit">最大ツモ回数</label>
      <select id="draw-limit" aria-describedby="draw-limit-note"></select>
      <p id="draw-limit-note">次の局から反映されます。</p>
    </div>
    <button id="sound" class="settings-button" type="button" aria-pressed="true">音 ON</button>
    <form method="dialog">
      <button class="settings-button" type="submit">閉じる</button>
    </form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
